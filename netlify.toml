[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'no build'"

[functions."waitlist-cleanup"]
  schedule = "@daily"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# Guest pages (entre.nyc/join/<token>): someone invited to a meetup without the app.
# The token in the URL is their key, so: never cached, never indexed, never sent on as a referrer.
[[headers]]
  for = "/join/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://nknrqcqyzlnyciudfggj.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[[headers]]
  for = "/join.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/cal/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/unsub/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/join/*"
  to = "/join.html"
  status = 200

# Guest emails and the guest page link here, so every link stays on entre.nyc.
# Proxied to the app's `guest` Edge Function: the calendar file, and one-click
# "stop these emails" (List-Unsubscribe).
[[redirects]]
  from = "/cal/*"
  to = "https://nknrqcqyzlnyciudfggj.supabase.co/functions/v1/guest/ics/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/unsub/*"
  to = "https://nknrqcqyzlnyciudfggj.supabase.co/functions/v1/guest/unsubscribe/:splat"
  status = 200
  force = true

# "Get Entre" everywhere (guest page, guest emails). Point it at the App Store
# listing once it's live; nothing else needs to change.
[[redirects]]
  from = "/app"
  to = "https://testflight.apple.com/join/BA1QZhgP"
  status = 302

[[redirects]]
  from = "/waitlist"
  to = "/waitlist.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/api/loops-webhook"
  to = "/.netlify/functions/loops-webhook"
  status = 200
